version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wow-tasks-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: wowtasks
      POSTGRES_PASSWORD: wowtasks_dev_2026
      POSTGRES_DB: wowtasks
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wowtasks']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wow-tasks-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://wowtasks:wowtasks_dev_2026@postgres:5432/wowtasks
      JWT_SECRET: dev_jwt_secret_change_in_prod_2026
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: development
      FIREBASE_ADMIN_SDK_PATH: /app/firebase-adminsdk.json
      UPLOAD_DIR: /app/uploads
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wow-tasks-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    ports:
      - '5174:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
